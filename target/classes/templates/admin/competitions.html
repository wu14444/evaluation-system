<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>竞赛证书管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>:root {
        --w: 240px
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box
    }

    body {
        font-family: 'Microsoft YaHei', sans-serif;
        background: #f5f7fa;
        display: flex;
        min-height: 100vh
    }

    .sidebar {
        width: var(--w);
        background: linear-gradient(180deg, #2c3e6d, #1a2744);
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100
    }

    .sidebar .logo {
        padding: 20px 16px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .sidebar .logo h5 {
        font-size: 15px;
        color: #e8e8ff;
        margin: 0
    }

    .sidebar .nav-item a {
        color: rgba(255, 255, 255, .75);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-size: 14px
    }

    .sidebar .nav-item a:hover, .sidebar .nav-item a.active {
        background: rgba(255, 255, 255, .08);
        color: #fff;
        border-left: 3px solid #5b9bff
    }

    .main-content {
        margin-left: var(--w);
        flex: 1;
        padding: 24px
    }

    .card-custom {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        padding: 20px;
        margin-bottom: 20px
    }

    .page-title {
        font-size: 20px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 16px;
        border-left: 4px solid #4e73df;
        padding-left: 10px
    }</style>
</head>
<body>
<aside class="sidebar">
    <div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div>
    <div class="nav-menu pt-2">
        <div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i>
            竞赛证书</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i>
            申诉管理</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a>
        </div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i>
            我要申诉</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a>
        </div>
        <div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
        <div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
        <div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
        <div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div>
    </div>
</aside>
<div class="main-content">
    <div class="page-title"><i class="bi bi-trophy"></i> 竞赛证书管理</div>
    <div class="card-custom">
        <div class="d-flex justify-content-between mb-3"><h6>竞赛/证书列表</h6>
            <button class="btn btn-primary btn-sm" onclick="openDialog()">+ 新增</button>
        </div>
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th>#</th>
                <th>名称</th>
                <th>类型</th>
                <th>等级</th>
                <th>奖项</th>
                <th>加分</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tb">
            <tr>
                <td colspan="7" class="text-center">加载中...</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="modal fade" id="dlg">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h6 id="dlgTitle">新增</h6>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="hidden" id="cid">
                    <div class="mb-2"><label>名称</label><input id="cn" class="form-control" maxlength="100"></div>
                    <div class="row g-2">
                        <div class="col"><label>类型</label><select id="ct" class="form-select">
                            <option value="0">竞赛</option>
                            <option value="1">证书</option>
                        </select></div>
                        <div class="col"><label>等级</label><select id="cl" class="form-select">
                            <option value="国家级">国家级</option>
                            <option value="省级">省级</option>
                            <option value="校级">校级</option>
                        </select></div>
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col"><label>奖项级别</label><input id="ca" class="form-control" maxlength="100">
                        </div>
                        <div class="col"><label>加分分值</label><input id="cb" type="number" step="0.1"
                                                                       class="form-control" value="0" min="0" max="100">
                        </div>
                    </div>
                    <div class="mb-2 mt-2"><label>排序</label><input id="cs" type="number" class="form-control"
                                                                     value="0" min="0"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="save()">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>let m;
document.addEventListener('DOMContentLoaded', () => {
    m = new bootstrap.Modal('#dlg');
    load()
});

function load() {
    fetch('/admin/api/competition/list').then(r => r.json()).then(d => {
        let l = d.data || d;
        document.getElementById('tb').innerHTML = l.length ? l.map(c => '<tr><td>' + (c.sortOrder || 0) + '</td><td>' + c.name + '</td><td>' + (c.type == 0 ? '竞赛' : '证书') + '</td><td><span class="badge ' + (c.level == '国家级' ? 'bg-danger' : c.level == '省级' ? 'bg-warning' : 'bg-info') + '">' + c.level + '</span></td><td>' + c.awardLevel + '</td><td><strong>+' + c.bonusScore + '</strong></td><td><button class="btn btn-sm btn-outline-primary" onclick="openDialog(' + c.id + ')">编辑</button> <button class="btn btn-sm btn-outline-danger" onclick="del(' + c.id + ')">删除</button></td></tr>').join('') : '<tr><td colspan=7 class=text-center>暂无数据</td></tr>'
    })
}

function openDialog(id) {
    document.getElementById('cid').value = id || '';
    if (id) {
        fetch('/admin/api/competition/list').then(r => r.json()).then(d => {
            let l = d.data || d, c = l.find(x => x.id == id);
            if (c) {
                document.getElementById('cn').value = c.name;
                document.getElementById('ct').value = c.type || 0;
                document.getElementById('cl').value = c.level;
                document.getElementById('ca').value = c.awardLevel;
                document.getElementById('cb').value = c.bonusScore;
                document.getElementById('cs').value = c.sortOrder || 0
            }
        })
    } else {
        document.getElementById('cn').value = '';
        document.getElementById('cb').value = 0;
        document.getElementById('cs').value = 0
    }
    m.show()
}

function save() {
    let name = document.getElementById('cn').value.trim();
    if (!name) {
        alert('请输入名称');
        return
    }
    if (name.length > 100) {
        alert('名称不能超过100个字符');
        return
    }
    let bonus = parseFloat(document.getElementById('cb').value) || 0;
    if (bonus <= 0 || bonus > 100) { alert('加分需在0-100之间'); return; }
    let d = {
        id: document.getElementById('cid').value || null,
        name: name,
        type: parseInt(document.getElementById('ct').value),
        level: document.getElementById('cl').value,
        awardLevel: document.getElementById('ca').value,
        bonusScore: bonus,
        sortOrder: parseInt(document.getElementById('cs').value) || 0,
        status: 1
    };
    fetch('/admin/api/competition/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(d)
    }).then(r => r.json()).then(r => {
        m.hide();
        load()
    })
}

function del(id) {
    if (!confirm('确定删除? ')) return;
    fetch('/admin/api/competition/delete/' + id, {method: 'DELETE'}).then(r => r.json()).then(r => load())
}</script>
</body>
</html>
