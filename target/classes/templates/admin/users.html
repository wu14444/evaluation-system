<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>用户管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}.badge-role{padding:4px 8px;border-radius:4px;font-size:12px;color:#fff}.badge-role.student{background:#0d6efd}.badge-role.teacher{background:#f0ad4e}.badge-role.admin{background:#dc3545}</style></head>
<body><aside class="sidebar"><div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div><div class="nav-menu pt-2">
<div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div>
<div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
<div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
<div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
<div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div></div></aside>
<div class="main-content"><div class="page-title"><i class="bi bi-people"></i> 用户管理</div>
<div class="card-custom"><button class="btn btn-primary btn-sm mb-3" onclick="openAdd()">+ 新增用户</button>
<table class="table table-bordered table-hover"><thead><tr><th>ID</th><th>姓名</th><th>学号</th><th>角色</th><th>班级</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<div class="modal fade" id="dlg"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h6 id="dlgT">新增用户</h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="uid"><div class="row g-2"><div class="col"><label>姓名</label><input id="un" class="form-control"></div><div class="col"><label>学号</label><input id="us" class="form-control"></div></div><div class="row g-2 mt-2"><div class="col"><label>角色</label><select id="ur" class="form-select"><option value="0">学生</option><option value="1">教师</option><option value="2">管理员</option></select></div><div class="col"><label>密码(留空不修改)</label><input id="up" class="form-control"></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" onclick="saveUser()">保存</button></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>var m;document.addEventListener('DOMContentLoaded',function(){m=new bootstrap.Modal('#dlg');load()});
function load(){fetch('/admin/api/user/list').then(r=>r.json()).then(function(d){var l=d.data||d;var h='';l.forEach(function(u){var rt=u.role==2?'<span class="badge-role admin">管理员</span>':u.role==1?'<span class="badge-role teacher">教师</span>':'<span class="badge-role student">学生</span>';var st=u.status==1?'<span class="badge bg-success">启用</span>':'<span class="badge bg-secondary">禁用</span>';var btns='<button class="btn btn-sm btn-outline-primary me-1" onclick="edit('+u.id+',\''+u.name+'\',\''+(u.student_no||'')+'\','+u.role+')">编辑</button>';btns+=u.status==1?'<button class="btn btn-sm btn-outline-warning me-1" onclick="tg('+u.id+',0)">禁用</button>':'<button class="btn btn-sm btn-outline-success me-1" onclick="tg('+u.id+',1)">启用</button>';btns+='<button class="btn btn-sm btn-outline-danger" onclick="del('+u.id+',\''+u.name+'\')">删除</button>';h+='<tr><td>'+u.id+'</td><td>'+u.name+'</td><td>'+(u.student_no||'')+'</td><td>'+rt+'</td><td>'+(u.class_name||'-')+'</td><td>'+st+'</td><td>'+btns+'</td></tr>'});document.getElementById('tb').innerHTML=h||'<tr><td colspan=7 class=text-center>暂无数据</td></tr>'})}
function openAdd(){document.getElementById('dlgT').textContent='新增用户';document.getElementById('uid').value='';document.getElementById('un').value='';document.getElementById('us').value='';document.getElementById('up').value='123456';document.getElementById('ur').value=0;m.show()}
function edit(id,name,sno,role){document.getElementById('dlgT').textContent='编辑 - '+name;document.getElementById('uid').value=id;document.getElementById('un').value=name;document.getElementById('us').value=sno;document.getElementById('up').value='';document.getElementById('ur').value=role;m.show()}
function saveUser(){var d={id:document.getElementById('uid').value||null,name:document.getElementById('un').value,studentNo:document.getElementById('us').value,role:parseInt(document.getElementById('ur').value)};var pw=document.getElementById('up').value;if(pw)d.password=pw;if(!d.id)d.status=1;fetch('/admin/api/user/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){m.hide();load()})}
function tg(id,s){fetch('/admin/api/user/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:s})}).then(function(r){load()})}
function del(id,n){if(!confirm('确定删除 '+n+' ?'))return;fetch('/admin/api/user/delete/'+id,{method:'DELETE'}).then(function(r){load()})}</script></body></html>
