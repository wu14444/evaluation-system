<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生自评</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script><style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px;transition:all .2s}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.stat-card{color:#fff;border-radius:10px;padding:20px}.sc-purple{background:linear-gradient(135deg,#667eea,#764ba2)}.sc-green{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#333}.sc-orange{background:linear-gradient(135deg,#fa8231,#fdc36b)}.sc-blue{background:linear-gradient(135deg,#4e73df,#36b9cc)}.stat-card .sv{font-size:28px;font-weight:700}.stat-card .sl{font-size:13px;opacity:.85}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}table td{vertical-align:middle}.btn{border-radius:6px}.badge{border-radius:4px;padding:4px 8px;font-size:12px}</style></head>
<body><aside class="sidebar">
<div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div>
<div class="nav-menu pt-2">
<div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div>
<div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
<div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
<div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
<div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div>
</div>
</aside><div class="main-content"><div class="page-title"><i class="bi bi-pencil-square"></i> 学生自评</div>
<div th:if="${batch==null}" class="card-custom text-center py-5">暂无进行中的评价批次</div>
<div th:if="${batch!=null}"><div class="alert alert-info">当前批次：<strong th:text="${batch.batchName}"></strong> | 学年：<span th:text="${batch.academicYear}"></span></div>
<!-- 进度条 -->
<div class="card-custom mb-3"><h6>📊 自评进度</h6><div class="progress" style="height:25px"><div class="progress-bar" id="progressBar" style="width:0%">0%</div></div></div>
<div th:each="ind:${indicators}" class="card-custom mb-2"><div class="row align-items-center"><div class="col-md-3"><strong th:text="${ind.indicatorName}"></strong><br><small class="text-muted">满分 <span th:text="${ind.maxScore}"></span> 分</small></div><div class="col-md-4"><input type="number" class="form-control score-input" th:attr="data-id=${ind.id}" th:max="${ind.maxScore}" min="0" th:value="${#maps.containsKey(existing,ind.id)?existing.get(ind.id).self_score:''}" placeholder="输入分数" onchange="updateProgress()"></div><div class="col-md-3"><textarea class="form-control" rows="2" th:attr="data-desc-id=${ind.id}" placeholder="自评说明" th:text="${#maps.containsKey(existing,ind.id)?existing.get(ind.id).description:''}"></textarea></div><div class="col-md-2"><input type="file" class="form-control form-control-sm" th:attr="data-file-id=${ind.id}" accept=".jpg,.png,.pdf" style="font-size:12px"><small class="text-muted">证明材料</small></div></div></div>
<!-- 竞赛证书加分 -->
<div class="card-custom mt-3"><h6>🏆 竞赛证书加分</h6><p class="text-muted" style="font-size:13px">勾选你获得的竞赛/证书，并上传证明材料(jpg/png/pdf)，系统验证后自动加分</p><div id="compList" class="row g-2">加载中...</div></div>
<div class="mt-3"><button class="btn btn-secondary me-2" onclick="save(false)">暂存</button><button class="btn btn-primary" onclick="save(true)">提交自评</button></div></div>
<script>const batchId=[[${batchId}]];var totalIndicators=[[${#lists.size(indicators)}]];
function updateProgress(){var inputs=document.querySelectorAll('.score-input');var filled=0;inputs.forEach(function(i){if(i.value)filled++});var pct=Math.round(filled/totalIndicators*100);var bar=document.getElementById('progressBar');bar.style.width=pct+'%';bar.textContent=pct+'% ('+filled+'/'+totalIndicators+')'}
// 加载竞赛列表
fetch('/admin/api/competition/list').then(r=>r.json()).then(function(d){var list=d.data||d;var html='';list.forEach(function(c){html+='<div class=col-md-6><div class="card-custom p-2 mb-1"><label class=form-check><input type=checkbox class=comp-check data-score='+c.bonusScore+' data-name="'+c.name+'" data-award="'+c.awardLevel+'"><span style=font-size:13px>'+c.name+' - '+c.awardLevel+' <span class="badge bg-success">+'+c.bonusScore+'</span></span></label><input type=file class="form-control form-control-sm mt-1 comp-file" accept=".jpg,.png,.pdf"><small class=text-danger>*须上传证明材料</small></div></div>'});document.getElementById('compList').innerHTML=html||'暂无竞赛数据'});
updateProgress();
async function save(submit){var data=[];document.querySelectorAll('.score-input').forEach(function(inp){var id=parseInt(inp.dataset.id);var score=parseFloat(inp.value)||0;var desc=document.querySelector('textarea[data-desc-id="'+id+'"]').value;data.push({batchId,indicatorId:id,selfScore:score,description:desc,status:submit?1:0})});await fetch('/student/api/self-eval/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
// 保存所有勾选的竞赛证书(需上传证明)
var comps=[];var allFiles=true;document.querySelectorAll('.comp-check:checked').forEach(function(cb,i){var fileInput=document.querySelectorAll('.comp-file')[i];if(!fileInput||!fileInput.files[0]){allFiles=false;return}comps.push({batchId:batchId,type:0,category:'竞赛获奖',title:cb.dataset.name+'('+cb.dataset.award+')',scoreChange:parseFloat(cb.dataset.score)||0,status:0})});
if(!allFiles&&comps.length>0){alert('请为每个勾选的竞赛证书上传证明材料！');return}
for(var i=0;i<comps.length;i++){await fetch('/api/reward-punish/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(comps[i])})}
if(submit)await fetch('/student/api/self-eval/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batchId})});alert(submit?'提交成功！':'暂存成功！');location.reload()}</script></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">,body:JSON.stringify({reason:r})}).then(function(resp){return resp.json()}).then(function(d){alert(d.msg)})}document.getElementById("appealLink").addEventListener("click",function(){var r=prompt("请输入申诉理由：");if(!r)return;fetch("/api/appeal/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:r})}).then(function(r){return r.json()}).then(function(d){alert(d.msg)})});</script>
</body></html>
