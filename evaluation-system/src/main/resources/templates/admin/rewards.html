<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>奖惩管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}</style></head>
<body><aside class="sidebar"><div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div><div class="nav-menu pt-2">
<div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div>
<div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
<div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
<div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
<div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div></div></aside>
<div class="main-content">
<div class="page-title"><i class="bi bi-award"></i> 奖惩管理</div>
<div class="card-custom"><div class="d-flex justify-content-between mb-3"><h6>奖惩记录</h6><button class="btn btn-primary btn-sm" onclick="openDialog()">+ 新增记录</button></div>
<table class="table table-bordered table-hover"><thead><tr><th>ID</th><th>学生</th><th>类型</th><th>类别</th><th>事由</th><th>分值</th><th>状态</th><th>操作</th></tr></thead>
<tbody><tr th:each="r:${list}"><td th:text="${r.id}"></td><td th:text="${r.student_name}"></td><td><span class="badge" th:classappend="${r.type==0}?'bg-success':'bg-danger'" th:text="${r.type==0}?'奖励':'惩罚'"></span></td><td th:text="${r.category}"></td><td th:text="${r.title}"></td><td th:text="${r.score_change}"></td><td><span class="badge" th:classappend="${r.status==0}?'bg-warning':(${r.status==1}?'bg-success':'bg-secondary')" th:text="${r.status==0}?'待审核':(${r.status==1}?'已通过':'已驳回')"></span></td><td><span th:if="${r.status==0}"><button class="btn btn-sm btn-success" th:onclick="'audit('+${r.id}+',1)'">通过</button> <button class="btn btn-sm btn-danger" th:onclick="'audit('+${r.id}+',2)'">驳回</button></span></td></tr></tbody></table></div>
<div class="modal fade" id="dlg"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h6>新增奖惩</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<div class="row g-2"><div class="col"><label>学生ID</label><input id="sid" type="number" class="form-control"></div><div class="col"><label>类型</label><select id="rt" class="form-select"><option value="0">奖励</option><option value="1">惩罚</option></select></div></div>
<div class="row g-2 mt-2"><div class="col"><label>类别</label><select id="rc" class="form-select"><option>竞赛获奖</option><option>论文发表</option><option>见义勇为</option><option>志愿服务</option><option>考试作弊</option><option>学术不端</option><option>违纪处分</option><option>旷课</option><option>宿舍违规</option></select></div><div class="col"><label>分值</label><input id="rs" type="number" step="0.1" class="form-control" value="0"></div></div>
<div class="mb-2 mt-2"><label>事由标题</label><input id="rtt" class="form-control"></div></div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" onclick="save()">保存</button></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>let m;document.addEventListener('DOMContentLoaded',()=>{m=new bootstrap.Modal('#dlg')});function openDialog(){m.show()}function save(){let d={studentId:parseInt(document.getElementById('sid').value),type:parseInt(document.getElementById('rt').value),category:document.getElementById('rc').value,title:document.getElementById('rtt').value,scoreChange:parseFloat(document.getElementById('rs').value)||0};fetch('/api/reward-punish/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json()).then(r=>{m.hide();location.reload()})}function audit(id,status){fetch('/api/reward-punish/audit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})}).then(r=>r.json()).then(r=>location.reload())}</script></body></html>
