<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生综合素质评价系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
            font-weight: 700;
        }

        .login-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 14px;
        }

        .btn-login {
            width: 100%;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h3>🎓 学生综合素质评价</h3>
    <p class="subtitle">中北大学 · 学生综合素质评价管理系统</p>
    <div id="errorMsg" class="alert alert-danger py-2" style="display:none;font-size:13px"></div>
    <div class="mb-3">
        <label class="form-label">账号（学号/工号）</label>
        <input type="text" class="form-control" id="username" placeholder="如：202401001 / T001 / A001" value="A001" maxlength="50" minlength="2" required>
    </div>
    <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" class="form-control" id="password" placeholder="默认密码123456" value="123456" maxlength="50" minlength="6" required>
    </div>
    <button class="btn btn-primary btn-login" onclick="doLogin()">登 录</button>
    <div class="mt-3 text-center" style="font-size:12px;color:#aaa">
        <div>管理员：A001 | 教师：T001 | 学生：202401001</div>
        <div>统一密码：123456</div>
    </div>
</div>
<script>
    async function doLogin() {
        const noInput = document.getElementById('username');
        const pwInput = document.getElementById('password');
        const no = noInput.value.trim();
        const pw = pwInput.value;

        if (!no || !pw) return showErr('请输入账号和密码');
        if (no.length < 2 || no.length > 50) return showErr('账号长度需在2-50个字符之间');
        if (pw.length < 6 || pw.length > 50) return showErr('密码长度需在6-50个字符之间');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({studentNo: no, password: pw})
            });
            const data = await res.json();
            if (data.code === 200) location.href = '/home';
            else showErr(data.msg);
        } catch (e) {
            showErr('登录失败，请检查网络: ' + e.message);
        }
    }

    function showErr(m) {
        const e = document.getElementById('errorMsg');
        e.textContent = m;
        e.style.display = 'block';
    }
</script>
</body>
</html>
