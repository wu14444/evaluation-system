<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>教师打分</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>:root {
        --w: 240px
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box
    }

    body {
        font-family: 'Microsoft YaHei', sans-serif;
        background: #f5f7fa;
        display: flex;
        min-height: 100vh
    }

    .sidebar {
        width: var(--w);
        background: linear-gradient(180deg, #2c3e6d, #1a2744);
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        overflow-y: auto
    }

    .sidebar .logo {
        padding: 20px 16px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .sidebar .logo h5 {
        font-size: 15px;
        color: #e8e8ff;
        margin: 0
    }

    .sidebar .nav-item a {
        color: rgba(255, 255, 255, .75);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-size: 14px;
        transition: all .2s
    }

    .sidebar .nav-item a:hover, .sidebar .nav-item a.active {
        background: rgba(255, 255, 255, .08);
        color: #fff;
        border-left: 3px solid #5b9bff
    }

    .main-content {
        margin-left: var(--w);
        flex: 1;
        padding: 24px
    }

    .card-custom {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        padding: 20px;
        margin-bottom: 20px
    }

    .stat-card {
        color: #fff;
        border-radius: 10px;
        padding: 20px
    }

    .sc-purple {
        background: linear-gradient(135deg, #667eea, #764ba2)
    }

    .sc-green {
        background: linear-gradient(135deg, #43e97b, #38f9d7);
        color: #333
    }

    .sc-orange {
        background: linear-gradient(135deg, #fa8231, #fdc36b)
    }

    .sc-blue {
        background: linear-gradient(135deg, #4e73df, #36b9cc)
    }

    .stat-card .sv {
        font-size: 28px;
        font-weight: 700
    }

    .stat-card .sl {
        font-size: 13px;
        opacity: .85
    }

    .page-title {
        font-size: 20px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 16px;
        border-left: 4px solid #4e73df;
        padding-left: 10px
    }

    table td {
        vertical-align: middle
    }

    .btn {
        border-radius: 6px
    }

    .badge {
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px
    }</style>
</head>
<body>
<aside class="sidebar">
    <div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div>
    <div class="nav-menu pt-2">
        <div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i>
            竞赛证书</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i>
            申诉管理</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a>
        </div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i>
            我要申诉</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a>
        </div>
        <div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
        <div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
        <div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
        <div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div>
    </div>
</aside>
<div class="main-content">
    <div class="page-title"><i class="bi bi-clipboard-check"></i> 教师打分</div>
    <div th:if="${selectedStudent==null}" class="card-custom"><h6>请选择学生</h6>
        <div class="list-group"><a th:each="s:${students}" th:href="@{'/teacher/scoring?studentId='+${s.id}}"
                                   class="list-group-item list-group-item-action"
                                   th:text="${s.name+' ('+s.student_no+')'}"></a></div>
    </div>
    <div th:if="${selectedStudent!=null}">
        <div class="alert alert-info">打分对象：<strong th:text="${selectedStudent}"></strong></div>
        <div th:each="ind:${indicators}" class="card-custom mb-2">
            <div class="row align-items-center">
                <div class="col-md-3"><strong th:text="${ind.indicatorName}"></strong><br><small>满分 <span
                        th:text="${ind.maxScore}"></span></small></div>
                <div class="col-md-4"><input type="number" class="form-control" th:attr="data-id=${ind.id}"
                                             th:max="${ind.maxScore}" min="0"
                                             th:value="${#maps.containsKey(existing,ind.id)?existing.get(ind.id).score:''}"
                                             placeholder="评分"></div>
                <div class="col-md-5"><input class="form-control" th:attr="data-comment-id=${ind.id}" placeholder="评语"
                                             th:value="${#maps.containsKey(existing,ind.id)?existing.get(ind.id).comment:''}">
                </div>
            </div>
        </div>
        <button class="btn btn-primary" onclick="saveScores()">提交评分</button>
    </div>
    <script>const batchId = [[${batchId}]], studentId = [[${selectedStudent}]];

    function saveScores() {
        const data = [];
        document.querySelectorAll('input[data-id]').forEach(inp => {
            const id = parseInt(inp.dataset.id);
            const score = parseFloat(inp.value) || 0;
            const comment = document.querySelector('input[data-comment-id="' + id + '"]').value;
            data.push({batchId, studentId, indicatorId: id, score, comment})
        });
        fetch('/teacher/api/teacher-eval/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        }).then(r => r.json()).then(r => {
            alert('保存成功！');
            location.reload()
        })
    }</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
