<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>学生成长档案</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}</style></head>
<body><aside class="sidebar"><div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div><div class="nav-menu pt-2">
<div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div>
<div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
<div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
<div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
<div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div></div></aside>
<div class="main-content"><div class="page-title"><i class="bi bi-graph-up-arrow"></i> 学生成长档案 <span class="badge bg-success ms-2">创新功能</span></div>
<p class="text-muted mb-3">查看学生多学期成绩变化，AI自动生成个性化评语</p>
<div class="card-custom mb-3">
<select class="form-select d-inline-block w-auto" id="studentSelect" onchange="loadGrowth()"><option value="">-- 选择学生 --</option><option th:each="s:${myStudents}" th:value="${s.id}" th:text="${s.name+' ('+s.student_no+')'}"></option></select>
<button class="btn btn-success ms-2" id="commentBtn" onclick="generateComment()" style="display:none"><i class="bi bi-magic"></i> AI生成评语</button></div>
<div id="growthArea"><div class="card-custom text-center py-5 text-muted">选择学生查看成长档案</div></div>
<div id="commentArea"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
var currentStudentId;
async function loadGrowth(){
  var sid=document.getElementById('studentSelect').value;
  if(!sid)return;
  currentStudentId=sid;
  document.getElementById('growthArea').innerHTML='加载中...';
  document.getElementById('commentBtn').style.display='inline-block';
  var resp=await axios.get('/teacher/api/growth-data?studentId='+sid);
  var d=resp.data.data;
  var hist=d.history||[];
  var html='';

  // 成绩趋势图
  if(hist.length>1){
    html+='<div class=card-custom><h6>各学期得分趋势</h6><div id="lineChart" style=height:300px></div></div>';
  }

  // 最新得分详情
  if(hist.length>0){
    var last=hist[hist.length-1];
    html+='<div class=card-custom><h6>最新学期得分详情</h6><table class="table table-bordered table-sm">';
    html+='<tr><td>综合得分</td><td><strong>'+last.finalScore+'分</strong></td></tr>';
    html+='<tr><td>排名</td><td>第'+last.ranking+'名</td></tr>';
    html+='<tr><td>自评总分</td><td>'+last.selfTotal+'</td></tr>';
    html+='<tr><td>教师评分</td><td>'+last.teacherTotal+'</td></tr>';
    html+='<tr><td>互评总分</td><td>'+last.peerTotal+'</td></tr>';
    html+='<tr><td>奖惩得分</td><td>'+last.bonusTotal+'</td></tr>';
    html+='</table></div>';
  }

  // 奖惩记录 - 分开显示奖励和惩罚
  var rewards = (d.rewards||[]).filter(function(r){return r.type=='奖励'});
  var punishments = (d.rewards||[]).filter(function(r){return r.type=='惩罚'});
  if(rewards.length>0){
    html+='<div class=card-custom><h6>奖励记录</h6><ul>';
    rewards.forEach(function(r){
      html+='<li><strong>'+r.title+'</strong> ('+r.category+') <span class="badge bg-success">+'+r.score+'分</span></li>';
    });
    html+='</ul></div>';
  }
  if(punishments.length>0){
    html+='<div class=card-custom><h6>惩罚记录</h6><ul>';
    punishments.forEach(function(r){
      html+='<li><strong>'+r.title+'</strong> <span class=text-muted>原因: '+r.category+'</span> <span class="badge bg-danger">'+r.score+'分</span></li>';
    });
    html+='</ul></div>';
  }

  document.getElementById('growthArea').innerHTML=html||'暂无数据';

  // 画折线图
  if(hist.length>1){
    setTimeout(function(){
      var chart=echarts.init(document.getElementById('lineChart'));
      chart.setOption({
        xAxis:{type:'category',data:hist.map(function(h){return h.batchName})},
        yAxis:{type:'value',min:0,max:100},
        series:[
          {type:'line',data:hist.map(function(h){return h.finalScore}),smooth:true,name:'总分'},
          {type:'line',data:hist.map(function(h){return h.selfTotal}),smooth:true,name:'自评'},
          {type:'line',data:hist.map(function(h){return h.teacherTotal}),smooth:true,name:'教师评'}
        ]
      });
    },200);
  }
}

async function generateComment(){
  if(!currentStudentId)return;
  document.getElementById('commentArea').innerHTML='AI生成中...';
  var resp=await axios.post('/teacher/api/generate-comment',{studentId:parseInt(currentStudentId)});
  document.getElementById('commentArea').innerHTML='<div class="card-custom mt-3"><h6><i class="bi bi-magic"></i> AI评语</h6><div class="alert alert-info">'+resp.data.data+'</div></div>';
}
</script></body></html>
