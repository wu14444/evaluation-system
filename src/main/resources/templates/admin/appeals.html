<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>申诉管理</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}</style></head><body><aside class="sidebar"><div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div><div class="nav-menu pt-2"><div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div><div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div><div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div><div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div><div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div><div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div><div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div><div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div><div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div><div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div></div></aside><div class="main-content"><div class="page-title"><i class="bi bi-exclamation-triangle"></i> 申诉管理</div>
<div class="card-custom">
<table class="table table-bordered table-hover"><thead><tr><th>ID</th><th>用户ID</th><th>内容</th><th>时间</th></tr></thead>
<tbody id="tb"><tr th:each="a:${appeals}"><td th:text="${a.id}"></td><td th:text="${a.userId}"></td><td th:text="${a.actionDetail}"></td><td th:text="${a.createTime}"></td></tr></tbody></table></div>
<div class="card-custom mt-3"><h6>回复申诉</h6><div class="mb-2"><label>选择要回复的学生</label><select id="studentSelect" class="form-select mb-2"><option value="">-- 选择学生 --</option></select></div><textarea id="reply" class="form-control mb-2" rows="3" placeholder="输入回复内容..."></textarea><button class="btn btn-primary" onclick="sendReply()">发送回复</button></div>
<script>
// 从申诉记录中提取学生姓名
var appeals = document.querySelectorAll('#tb tr');
var students = new Set();
appeals.forEach(function(row){
  var txt = row.textContent;
  var m = txt.match(/学生(.+?)提交/);
  if(m) students.add(m[1]);
});
var sel = document.getElementById('studentSelect');
students.forEach(function(s){ sel.innerHTML += '<option value="'+s+'">'+s+'</option>' });

function sendReply(){
  var t = document.getElementById('reply').value.trim();
  var s = document.getElementById('studentSelect').value;
  if(!t||!s){ alert('请选择学生并输入回复内容'); return; }
  fetch('/api/appeal/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reply:t, studentName:s})}).then(function(r){ alert('已发送'); location.reload(); })
}</script></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
