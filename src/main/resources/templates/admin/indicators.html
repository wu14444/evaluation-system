<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>指标设置</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>:root {
        --w: 240px
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box
    }

    body {
        font-family: 'Microsoft YaHei', sans-serif;
        background: #f5f7fa;
        display: flex;
        min-height: 100vh
    }

    .sidebar {
        width: var(--w);
        background: linear-gradient(180deg, #2c3e6d, #1a2744);
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        overflow-y: auto
    }

    .sidebar .logo {
        padding: 20px 16px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, .08)
    }

    .sidebar .logo h5 {
        font-size: 15px;
        color: #e8e8ff;
        margin: 0
    }

    .sidebar .nav-item a {
        color: rgba(255, 255, 255, .75);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-size: 14px;
        transition: all .2s
    }

    .sidebar .nav-item a:hover, .sidebar .nav-item a.active {
        background: rgba(255, 255, 255, .08);
        color: #fff;
        border-left: 3px solid #5b9bff
    }

    .main-content {
        margin-left: var(--w);
        flex: 1;
        padding: 24px
    }

    .card-custom {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        padding: 20px;
        margin-bottom: 20px
    }

    .stat-card {
        color: #fff;
        border-radius: 10px;
        padding: 20px
    }

    .sc-purple {
        background: linear-gradient(135deg, #667eea, #764ba2)
    }

    .sc-green {
        background: linear-gradient(135deg, #43e97b, #38f9d7);
        color: #333
    }

    .sc-orange {
        background: linear-gradient(135deg, #fa8231, #fdc36b)
    }

    .sc-blue {
        background: linear-gradient(135deg, #4e73df, #36b9cc)
    }

    .stat-card .sv {
        font-size: 28px;
        font-weight: 700
    }

    .stat-card .sl {
        font-size: 13px;
        opacity: .85
    }

    .page-title {
        font-size: 20px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 16px;
        border-left: 4px solid #4e73df;
        padding-left: 10px
    }

    table td {
        vertical-align: middle
    }

    .btn {
        border-radius: 6px
    }

    .badge {
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px
    }</style>
</head>
<body>
<aside class="sidebar">
    <div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div>
    <div class="nav-menu pt-2">
        <div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i>
            竞赛证书</a></div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a>
        </div>
        <div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i>
            申诉管理</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a>
        </div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i>
            我要申诉</a></div>
        <div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a>
        </div>
        <div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a>
        </div>
        <div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
        <div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
        <div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
        <div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div>
    </div>
</aside>
<div class="main-content">
    <div class="page-title"><i class="bi bi-gear"></i> 评价指标管理</div>
    <div class="card-custom">
        <h6>指标大类
            <button class="btn btn-primary btn-sm float-end" onclick="openCat()">+ 新增</button>
        </h6>
        <table class="table table-bordered table-hover mt-2">
            <thead>
            <tr>
                <th>#</th>
                <th>大类名称</th>
                <th>排序</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c:${categories}">
                <td th:text="${c.sortOrder}"></td>
                <td th:text="${c.categoryName}"></td>
                <td th:text="${c.sortOrder}"></td>
                <td><span class="badge" th:classappend="${c.status==1}?'bg-success':'bg-secondary'"
                          th:text="${c.status==1}?'启用':'停用'"></span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" th:onclick="'editCat('+${c.id}+')'">编辑</button>
                    <button class="btn btn-sm btn-outline-danger" th:onclick="'delCat('+${c.id}+')'">删除</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="card-custom">
        <h6>指标项列表
            <button class="btn btn-primary btn-sm float-end" onclick="openInd()">+ 新增</button>
        </h6>
        <table class="table table-bordered table-hover mt-2">
            <thead>
            <tr>
                <th>#</th>
                <th>指标名称</th>
                <th>大类</th>
                <th>满分</th>
                <th>权重</th>
                <th>类型</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i:${list}">
                <td th:text="${i.sort_order}"></td>
                <td th:text="${i.indicator_name}"></td>
                <td><span class="badge bg-info" th:text="${i.category_name}"></span></td>
                <td th:text="${i.max_score}"></td>
                <td th:text="${i.weight}"></td>
                <td th:text="${i.eval_type==0}?'自评':(${i.eval_type==1}?'教师评':(${i.eval_type==2}?'互评':'通用'))"></td>
                <td><span class="badge" th:classappend="${i.status==1}?'bg-success':'bg-secondary'"
                          th:text="${i.status==1}?'启用':'停用'"></span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" th:onclick="'editInd('+${i.id}+')'">编辑</button>
                    <button class="btn btn-sm btn-outline-danger" th:onclick="'delInd('+${i.id}+')'">删除</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="modal fade" id="catDlg">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h6>大类</h6>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="hidden" id="cid">
                    <div class="mb-2"><label>名称</label><input id="cn" class="form-control" maxlength="50" required></div>
                    <div class="mb-2"><label>排序</label><input id="cs" type="number" class="form-control" value="1" min="1" max="100">
                    </div>
                    <div class="mb-2"><label>状态</label><select id="cst" class="form-select">
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="saveCat()">保存</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="indDlg">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h6>指标</h6>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"><input type="hidden" id="iid">
                    <div class="mb-2"><label>大类</label><select id="icid" class="form-select">
                        <option th:each="c:${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option>
                    </select></div>
                    <div class="mb-2"><label>名称</label><input id="in" class="form-control" maxlength="100" required></div>
                    <div class="row g-2">
                        <div class="col"><label>满分</label><input id="im" type="number" step="0.1" class="form-control"
                                                                   value="100" min="0" max="100"></div>
                        <div class="col"><label>权重</label><input id="iw" type="number" step="0.1" class="form-control"
                                                                   value="1"></div>
                    </div>
                    <div class="mb-2"><label>类型</label><select id="it" class="form-select">
                        <option value="3">通用</option>
                        <option value="0">仅自评</option>
                        <option value="1">仅教师评</option>
                        <option value="2">仅互评</option>
                    </select></div>
                    <div class="mb-2"><label>排序</label><input id="is" type="number" class="form-control" value="1" min="1" max="100">
                    </div>
                    <div class="mb-2"><label>状态</label><select id="ist" class="form-select">
                        <option value="1">启用</option>
                        <option value="0">停用</option>
                    </select></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary" onclick="saveInd()">保存</button>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">var CATEGORIES =/*[[${categories}]]*/[];
    var INDICATORS =/*[[${list}]]*/[];
    let cm, im;
    document.addEventListener('DOMContentLoaded', () => {
        cm = new bootstrap.Modal('#catDlg');
        im = new bootstrap.Modal('#indDlg')
    });

    function openCat(id) {
        document.getElementById('cid').value = id || '';
        if (id) {
            let c = CATEGORIES.find(x => x.id == id);
            if (c) {
                document.getElementById('cn').value = c.categoryName;
                document.getElementById('cs').value = c.sortOrder;
                document.getElementById('cst').value = c.status
            }
        } else {
            document.getElementById('cn').value = '';
            document.getElementById('cs').value = 1
        }
        cm.show()
    }

    function saveCat() {
        let name = document.getElementById('cn').value.trim();
        if (!name) { alert('请输入大类名称'); return; }
        if (name.length > 50) { alert('大类名称不能超过50个字符'); return; }
        let sortOrder = parseInt(document.getElementById('cs').value) || 0;
        if (sortOrder < 1 || sortOrder > 100) { alert('排序必须在1-100之间'); return; }
        let d = {
            id: document.getElementById('cid').value || null,
            categoryName: name,
            sortOrder: sortOrder,
            status: parseInt(document.getElementById('cst').value)
        };
        fetch('/admin/api/category/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).then(r => r.json()).then(r => {
            cm.hide();
            location.reload()
        })
    }

    function delCat(id) {
        if (!confirm('确定删除？')) return;
        fetch('/admin/api/category/delete/' + id, {method: 'DELETE'}).then(r => r.json()).then(r => location.reload())
    }

    function openInd(id) {
        document.getElementById('iid').value = id || '';
        if (id) {
            let i = INDICATORS.find(x => x.id == id);
            if (i) {
                document.getElementById('icid').value = i.category_id;
                document.getElementById('in').value = i.indicator_name;
                document.getElementById('im').value = i.max_score;
                document.getElementById('iw').value = i.weight;
                document.getElementById('it').value = i.eval_type || 3;
                document.getElementById('is').value = i.sort_order || 1;
                document.getElementById('ist').value = i.status
            }
        } else {
            document.getElementById('in').value = '';
            document.getElementById('im').value = 100;
            document.getElementById('iw').value = 1
        }
        im.show()
    }

    function saveInd() {
        let name = document.getElementById('in').value.trim();
        if (!name) { alert('请输入指标名称'); return; }
        if (name.length > 100) { alert('指标名称不能超过100个字符'); return; }
        let maxScore = parseFloat(document.getElementById('im').value) || 100;
        if (maxScore <= 0 || maxScore > 100) { alert('满分需在1-100之间'); return; }
        let weight = parseFloat(document.getElementById('iw').value) || 1;
        if (weight <= 0 || weight > 100) { alert('权重需在0.1-100之间'); return; }
        let sortOrder = parseInt(document.getElementById('is').value) || 0;
        if (sortOrder < 1 || sortOrder > 100) { alert('排序必须在1-100之间'); return; }
        let d = {
            id: document.getElementById('iid').value || null,
            categoryId: parseInt(document.getElementById('icid').value),
            indicatorName: name,
            maxScore: maxScore,
            weight: weight,
            scoringStandard: '',
            sortOrder: sortOrder,
            status: parseInt(document.getElementById('ist').value),
            evalType: parseInt(document.getElementById('it').value)
        };
        fetch('/admin/api/indicator/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(d)
        }).then(r => r.json()).then(r => {
            im.hide();
            location.reload()
        })
    }

    function delInd(id) {
        if (!confirm('确定删除？')) return;
        fetch('/admin/api/indicator/delete/' + id, {method: 'DELETE'}).then(r => r.json()).then(r => location.reload())
    }</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
