<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生首页</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script><style>:root{--w:240px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;background:#f5f7fa;display:flex;min-height:100vh}.sidebar{width:var(--w);background:linear-gradient(180deg,#2c3e6d,#1a2744);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto}.sidebar .logo{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}.sidebar .logo h5{font-size:15px;color:#e8e8ff;margin:0}.sidebar .nav-item a{color:rgba(255,255,255,.75);padding:12px 20px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px;transition:all .2s}.sidebar .nav-item a:hover,.sidebar .nav-item a.active{background:rgba(255,255,255,.08);color:#fff;border-left:3px solid #5b9bff}.main-content{margin-left:var(--w);flex:1;padding:24px}.card-custom{background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:20px;margin-bottom:20px}.stat-card{color:#fff;border-radius:10px;padding:20px}.sc-purple{background:linear-gradient(135deg,#667eea,#764ba2)}.sc-green{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#333}.sc-orange{background:linear-gradient(135deg,#fa8231,#fdc36b)}.sc-blue{background:linear-gradient(135deg,#4e73df,#36b9cc)}.stat-card .sv{font-size:28px;font-weight:700}.stat-card .sl{font-size:13px;opacity:.85}.page-title{font-size:20px;font-weight:600;color:#2c3e50;margin-bottom:16px;border-left:4px solid #4e73df;padding-left:10px}table td{vertical-align:middle}.btn{border-radius:6px}.badge{border-radius:4px;padding:4px 8px;font-size:12px}</style></head>
<body><aside class="sidebar">
<div class="logo"><h5><i class="bi bi-mortarboard"></i> 学生综合素质评价</h5></div>
<div class="nav-menu pt-2">
<div class="nav-item"><a href="/home"><i class="bi bi-speedometer2"></i> 首页</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/indicators"><i class="bi bi-gear"></i> 指标设置</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/competitions"><i class="bi bi-trophy"></i> 竞赛证书</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/batches"><i class="bi bi-calendar-check"></i> 评价批次</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/users"><i class="bi bi-people"></i> 用户管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/classes"><i class="bi bi-building"></i> 班级管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/rewards"><i class="bi bi-award"></i> 奖惩管理</a></div>
<div class="nav-item" th:if="${role == 2}"><a href="/admin/appeals"><i class="bi bi-exclamation-triangle"></i> 申诉管理</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/self-eval"><i class="bi bi-pencil-square"></i> 学生自评</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/appeal"><i class="bi bi-exclamation-triangle"></i> 我要申诉</a></div>
<div class="nav-item" th:if="${role == 0}"><a href="/student/peer-eval"><i class="bi bi-people-fill"></i> 班级互评</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/scoring"><i class="bi bi-clipboard-check"></i> 教师打分</a></div>
<div class="nav-item" th:if="${role == 1}"><a href="/teacher/growth"><i class="bi bi-graph-up-arrow"></i> 成长档案</a></div>
<div class="nav-item"><a href="/score/summary"><i class="bi bi-bar-chart"></i> 分数汇总</a></div>
<div class="nav-item"><a href="/ai-assistant"><i class="bi bi-robot"></i> AI助手</a></div>
<div class="nav-item"><a href="/data-screen"><i class="bi bi-display"></i> 数据大屏</a></div>
<div class="nav-item mt-3"><a href="/logout"><i class="bi bi-box-arrow-right"></i> 退出登录</a></div>
</div>
</aside><div class="main-content"><div class="page-title"><i class="bi bi-speedometer2"></i> 我的评价概览</div>
<div th:if="${currentBatch!=null}"><div class="row g-3 mb-3"><div class="col-md-3"><div class="stat-card sc-purple"><div class="sl">当前批次</div><div class="sv" style="font-size:16px" th:text="${currentBatch.batchName}"></div></div></div><div class="col-md-3"><div class="stat-card sc-green"><div class="sl">自评进度</div><div class="sv" th:text="${submittedCount+'/'+totalIndicators}"></div></div></div><div class="col-md-3"><div class="stat-card sc-orange"><div class="sl">我的得分</div><div class="sv" th:text="${myScore!=null?myScore.final_score:'-'}"></div></div></div><div class="col-md-3"><div class="stat-card sc-blue"><div class="sl">排名</div><div class="sv" th:text="${myScore!=null?myScore.ranking:'-'}"></div></div></div></div></div>
<div th:if="${currentBatch==null}" class="card-custom text-center py-5">暂无进行中的评价批次</div>
<div class="card-custom"><h6>快捷操作</h6><a href="/student/self-eval" class="btn btn-primary me-2"><i class="bi bi-pencil-square"></i> 开始自评</a><a href="/student/peer-eval" class="btn btn-success me-2"><i class="bi bi-people-fill"></i> 班级互评</a><a href="/ai-assistant" class="btn btn-outline-primary"><i class="bi bi-robot"></i> AI分析</a></div>
<!-- 德智体美劳成绩展示 -->
<div class="card-custom mt-3"><h6>📊 我的德智体美劳成绩（各维度满分100）</h6><div class="row"><div class="col-md-6"><div id="radar" style="height:320px"></div></div><div class="col-md-6"><div id="dimTable"></div></div></div></div>
<!-- 提醒通知 -->
<div class="card-custom mt-3" id="reminderBox" style="display:none"><h6 class="text-warning">📢 教师提醒</h6><div id="reminderList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
// 加载德智体美劳成绩
fetch('/student/api/dimension-scores').then(r=>r.json()).then(function(d){var dims=d.data||[];if(dims.length>0){var radar=echarts.init(document.getElementById('radar'));radar.setOption({radar:{indicator:dims.map(function(x){return{name:x.name,max:100}})},series:[{type:'radar',data:[{value:dims.map(function(x){return x.score||0}),name:'得分'}],areaStyle:{color:'rgba(102,126,234,0.3)'}}]});document.getElementById('dimTable').innerHTML='<table class="table table-sm mt-3">'+dims.map(function(x){return'<tr><td><strong>'+x.name+'</strong> (权重'+x.weight+'%)</td><td><div class=progress style=height:22px><div class=progress-bar style=width:'+x.score+'%>'+x.score+'分</div></div></td></tr>'}).join('')+'</table>'}});
// 加载提醒
fetch('/student/api/my-reminders').then(r=>r.json()).then(function(d){var items=d.data||[];if(items.length>0){document.getElementById('reminderBox').style.display='block';document.getElementById('reminderList').innerHTML=items.map(function(i){return'<div class="alert alert-warning py-2 mb-1"><i class="bi bi-bell"></i> '+i.actionDetail+' <small class=text-muted>'+i.createTime+'</small></div>'}).join('')}})</script></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">,body:JSON.stringify({reason:r})}).then(function(resp){return resp.json()}).then(function(d){alert(d.msg)})}document.getElementById("appealLink").addEventListener("click",function(){var r=prompt("请输入申诉理由：");if(!r)return;fetch("/api/appeal/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:r})}).then(function(r){return r.json()}).then(function(d){alert(d.msg)})});</script>
<div th:replace="~{fragments/ai-chat :: floating-chat}"></div></body></html>
